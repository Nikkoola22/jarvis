<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS HUD — Assistant Personnel macOS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: radial-gradient(circle at 50% 30%, #030712 0%, #020617 100%);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .hud-glass {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(56, 189, 248, 0.2);
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.08);
    }
    .glow-cyan {
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
    }
    .arc-glow {
      filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.6));
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between p-6">

  <!-- HUD Top Bar -->
  <header class="max-w-4xl w-full mx-auto flex items-center justify-between border-b border-cyan-500/20 pb-4">
    <div class="flex items-center gap-3">
      <div class="w-3 h-3 rounded-full bg-cyan-400 animate-ping"></div>
      <h1 class="font-extrabold tracking-widest text-lg text-cyan-400 uppercase font-mono">JARVIS // LOCAL OS</h1>
    </div>
    <div class="flex items-center gap-4 text-xs font-mono text-slate-400">
      <span>CPU : <strong class="text-cyan-300">Intel i7</strong></span>
      <span>GPU : <strong class="text-indigo-300">Radeon Pro 560</strong></span>
      <span>LLM : <strong class="text-emerald-400">Llama 3.2 (3B)</strong></span>
    </div>
  </header>

  <!-- Central Arc Reactor / Waveform -->
  <main class="max-w-3xl w-full mx-auto my-auto flex flex-col items-center justify-center text-center">
    
    <!-- Arc Reactor Visual -->
    <div class="relative w-48 h-48 flex items-center justify-center mb-6">
      <div class="absolute inset-0 rounded-full border border-cyan-500/20 animate-spin" style="animation-duration: 20s;"></div>
      <div class="absolute inset-2 rounded-full border-2 border-dashed border-cyan-400/40 animate-spin" style="animation-duration: 12s; animation-direction: reverse;"></div>
      <div class="w-28 h-28 rounded-full bg-cyan-950/40 hud-glass flex items-center justify-center border border-cyan-400/50 glow-cyan cursor-pointer" onclick="activateListening()">
        <span class="text-3xl arc-glow">💠</span>
      </div>
    </div>

    <!-- Live Status / Response -->
    <div id="statusBadge" class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-mono bg-cyan-500/10 text-cyan-300 border border-cyan-500/30 mb-3">
      ● SYSTÈME ACTIF ET EN ATTENTE
    </div>

    <div id="speechBox" class="hud-glass rounded-2xl p-6 w-full max-w-2xl text-left border border-cyan-500/30 min-h-[110px] flex items-center">
      <p id="jarvisText" class="text-slate-200 text-sm md:text-base leading-relaxed">
        « Bonjour monsieur Nikkoola. Tous les systèmes du MacBook Pro sont opérationnels. Quel est votre ordre ? »
      </p>
    </div>

    <!-- Quick Commands -->
    <div class="flex flex-wrap items-center justify-center gap-2 mt-4 text-xs font-mono">
      <button onclick="sendQuick('Rapport télémétrie complet')" class="px-3 py-1.5 rounded-lg bg-white/5 hover:bg-cyan-500/20 border border-white/10 hover:border-cyan-400/40 transition-colors">
        📊 Télémétrie
      </button>
      <button onclick="sendQuick('Quel temps fait-il à Paris ?')" class="px-3 py-1.5 rounded-lg bg-white/5 hover:bg-cyan-500/20 border border-white/10 hover:border-cyan-400/40 transition-colors">
        🌧️ Météo
      </button>
      <button onclick="sendQuick('État de la batterie')" class="px-3 py-1.5 rounded-lg bg-white/5 hover:bg-cyan-500/20 border border-white/10 hover:border-cyan-400/40 transition-colors">
        🔋 Batterie
      </button>
      <button onclick="sendQuick('Bascule le mode sombre')" class="px-3 py-1.5 rounded-lg bg-white/5 hover:bg-cyan-500/20 border border-white/10 hover:border-cyan-400/40 transition-colors">
        🌓 Dark Mode
      </button>
    </div>
  </main>

  <!-- Input Bar -->
  <footer class="max-w-3xl w-full mx-auto">
    <form onsubmit="handleQuery(event)" class="relative flex items-center">
      <input 
        id="userInput" 
        type="text" 
        placeholder="Donner un ordre à JARVIS ou poser une question..."
        class="w-full bg-slate-900/80 border border-cyan-500/30 rounded-2xl px-5 py-3.5 pr-28 text-sm focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 text-white placeholder-slate-500 font-sans shadow-lg"
      />
      <button 
        type="submit" 
        class="absolute right-2 px-4 py-2 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white text-xs font-bold rounded-xl transition-all shadow-md flex items-center gap-1.5 font-mono"
      >
        EXÉCUTER ↵
      </button>
    </form>
  </footer>

  <script>
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'fr-FR';
        utter.rate = 1.05;
        window.speechSynthesis.speak(utter);
      }
    }

    function sendQuick(prompt) {
      document.getElementById('userInput').value = prompt;
      handleQuery(new Event('submit'));
    }

    async function handleQuery(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('userInput');
      const val = input.value.trim();
      if (!val) return;

      const textBox = document.getElementById('jarvisText');
      const statusBadge = document.getElementById('statusBadge');

      statusBadge.innerHTML = `<span class="animate-spin inline-block">⚙️</span> TRAITEMENT EN COURS...`;
      statusBadge.className = "inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-mono bg-amber-500/20 text-amber-300 border border-amber-500/40 mb-3";

      try {
        const resp = await fetch('http://localhost:11434/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'llama3.2:3b',
            prompt: `Tu es JARVIS, assistant personnel d'élite sur macOS. Réponds en français de façon concise et courtoise à : ${val}`,
            stream: false
          })
        });

        const data = await resp.json();
        const reply = data.response.trim();

        textBox.textContent = reply;
        speakText(reply);

        statusBadge.innerHTML = `● RÉPONSE GÉNÉRÉE AVEC SUCCÈS`;
        statusBadge.className = "inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-mono bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 mb-3";
      } catch (err) {
        textBox.textContent = "Erreur de connexion avec le serveur local Ollama (port 11434). Assurez-vous que le service est lancé.";
      }
      input.value = '';
    }

    function activateListening() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("La reconnaissance vocale par navigateur nécessite Safari ou Chrome.");
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = 'fr-FR';
      recognition.start();

      const statusBadge = document.getElementById('statusBadge');
      statusBadge.innerHTML = `<span class="animate-pulse">🎙️</span> ÉCOUTE EN COURS...`;
      statusBadge.className = "inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-mono bg-red-500/20 text-red-300 border border-red-500/40 mb-3";

      recognition.onresult = function(event) {
        const text = event.results[0][0].transcript;
        document.getElementById('userInput').value = text;
        handleQuery(null);
      };
    }
  </script>
</body>
</html>
